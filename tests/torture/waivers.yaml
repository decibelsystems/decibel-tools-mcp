# ---------------------------------------------------------------------------
# S4-batch — /batch does not run the sweep in sequence, and cannot
# ---------------------------------------------------------------------------
# stdio, the thin client and /call each run the sweep one call at a time.
# /batch runs a chunk of up to twenty in PARALLEL, which is its entire purpose.
# A read whose answer depends on what has already run therefore answers
# differently there, and it is not the transport mangling the payload — it is
# the call observing a different history.
#
# The waiver is narrow on purpose: it suspends only the stdio-vs-/batch payload
# comparison. These actions are still compared across stdio, thin and /call,
# still checked for the failure marker on all four, and still required to
# preserve S2's discriminability on all four.

- action: sentinel.audit_policies
  waived: [S4-batch]
  reason: "Reports freshness timestamps of compiled policy and test manifests. Another call in the same parallel batch compiles them, so the freshness block differs by execution order rather than by transport. Verified order-dependent: reversing the pass order moved the odd answer to whichever transport ran first."
  owner: ben
  expires: 2027-03-01

- action: oracle.hygiene_report
  waived: [S4-batch]
  reason: "Counts analysed vector runs, which other calls in the same parallel batch create. runsAnalyzed differs by execution order, not by transport."
  owner: ben
  expires: 2027-03-01

- action: vector.list_runs
  waived: [S4-batch]
  reason: "Lists runs that dispatch auto-tracks. A parallel batch has created one by the time this read runs, where a sequential sweep reaches the read first. Ordering, not payload mangling."
  owner: ben
  expires: 2027-03-01

- action: vector.assumptions
  waived: [S4-batch]
  reason: "Aggregates over the same auto-tracked runs as vector.list_runs, and diverges for the same ordering reason."
  owner: ben
  expires: 2027-03-01

# ---------------------------------------------------------------------------
# S2 — reads that do not consult the project's .decibel store
# ---------------------------------------------------------------------------
# The same reasoning as the corpus and deck waivers above: S2's four situations
# are PROJECT-STORE situations, so a read that never opens the project store
# legitimately answers identically in all four. Waiving is a statement that
# this sweep cannot tell, not that the read handles absence well.
#
# These were all found by the sweep failing in all THREE situations at once,
# which is the signature: a read that consults the store fails in one or two,
# a read that does not fails in every one.

- action: decibel.about
  waived: [S2]
  reason: "Static product information compiled into the tool. There is no store to be empty, unreadable, or unparseable."
  owner: ben
  expires: 2027-03-01

- action: decibel.capabilities
  waived: [S2]
  reason: "Static product information compiled into the tool. No store read of any kind."
  owner: ben
  expires: 2027-03-01

- action: decibel.case_studies
  waived: [S2]
  reason: "Static product information compiled into the tool. No store read of any kind."
  owner: ben
  expires: 2027-03-01

- action: registry.list
  waived: [S2]
  reason: "Lists the machine's project registry (~/.decibel/projects.json), which is what makes a project resolvable in the first place. A per-project store situation cannot change its answer."
  owner: ben
  expires: 2027-03-01

- action: registry.config_list
  waived: [S2]
  reason: "Enumerates the configurable facades and their environment variables from the tool's own definitions. Nothing per-project is read."
  owner: ben
  expires: 2027-03-01

- action: swarm.session_status
