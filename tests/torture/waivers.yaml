# Torture-test waivers.
#
# An action listed here is deliberately not covered by the named sweeps.
# A waiver is a visible, reviewable decision; an untested tool is not.
# Waivers EXPIRE. An expired waiver fails S0 — renew it or remove it.
#
# Every waiver below is for the same reason: S2's four situations are
# PROJECT-STORE situations (empty / unreadable / unparseable / unresolvable
# .decibel), and these reads do not consult the project store at all. Waiving
# them is not a statement that they handle absence well — it is a statement
# that this sweep cannot tell. A remote-absence sweep is the follow-up.

- action: corpus.status
  waived: [S2]
  reason: "Reads the shared corpus over the network, not the project's .decibel store."
  owner: ben
  expires: 2026-12-01

