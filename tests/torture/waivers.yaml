  reason: "Reads agent signals from Supabase, not the project's .decibel store."
  owner: ben
  expires: 2027-03-01

- action: dojo.projects
  waived: [S2]
  reason: "Lists every registered project on the machine. It answers ABOUT projects rather than FROM one, so a single project's store situation cannot change it."
  owner: ben
  expires: 2027-03-01

- action: oracle.portfolio_summary
  waived: [S2]
  reason: "Summarises across the whole portfolio rather than one project. One project's store being unreadable is a fact it should surface, but that is a different assertion from the one S2 makes."
  owner: ben
  expires: 2027-03-01

# guardian scans the SOURCE TREE (src/, package.json, the global config), never
# the project's .decibel store — so no store situation reaches it. Worth
# recording what the sweep did show: on an unresolvable project id, every
# guardian scan falls back to process.cwd() and grades whatever directory the
# caller happens to be in, reporting it under the project id that named
# nothing. That fallback is deliberate (the pre-push hook relies on it) but it
# is a different hazard from the one S2 tests, and it is not waived here — it
# is filed separately.

- action: guardian.scan_deps
  waived: [S2]
  reason: "Audits the dependency tree via npm, not the project's .decibel store."
  owner: ben
  expires: 2027-03-01

- action: guardian.scan_secrets
  waived: [S2]
  reason: "Scans source directories, not the project's .decibel store. Only the allowlist comes from .decibel, and its absence is not one of the four situations."
  owner: ben
  expires: 2027-03-01

- action: guardian.scan_http
  waived: [S2]
  reason: "Inspects HTTP server configuration in source, not the project's .decibel store."
