name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      # Some tests spawn real child processes against the compiled output —
      # the cross-process id-allocation test cannot exercise O_EXCL across
      # process boundaries by importing TypeScript. Building here keeps the
      # unit suite self-contained rather than depending on the `build` job,
      # which runs after this one.
      - name: Build (required by cross-process tests)
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        if: matrix.node-version == 20
        # Coverage thresholds (90/80/90/90 in vitest.config.ts) exceed the
        # current realistic floor (~7/68/43/7). The include glob src/**/*.ts
        # counts hundreds of never-imported tool files toward the denominator.
        # Keep coverage non-blocking while we either narrow the include glob
        # or right-size the thresholds.
        continue-on-error: true
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ==========================================================================
  # Cross-platform check — the team is tri-platform, CI was not (ISS-0176)
  # ==========================================================================
  # Every job above runs on ubuntu-latest, and the matrix above varies NODE
  # VERSION, not OS. That left the platform with exactly one user (Linux) as the
  # only one continuously verified, while the primary development platform
  # (macOS) and the installer's target (Windows) were checked by hand.
  #
  # SCOPE, deliberately narrower than `npm test`. This runs the portable core —
  # type check, build, unit suite — and NOT the torture or e2e sweeps. Those
  # sweeps build their fixtures with chmod (an unreadable directory to force
  # EACCES) and hardcoded /tmp paths, neither of which behaves on Windows. Red
  # there would mean "the harness is POSIX-bound", which we already know, and it
  # would drown out the signal we actually want: does the product type-check,
  # build, and behave on these platforms.
  #
  # Widening this to the full suite is worthwhile, but it is a test-portability
  # project, not a flag change. Until then do NOT read a green here as full
  # platform coverage.
  #
  # Not a dependency of `build` on purpose: a platform failure should be visible
  # without blocking the pipeline while we learn what is actually broken.
  test-platforms:
    name: ${{ matrix.os }} (node 20, portable core)
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, the first platform to fail cancels the others and we lose
      # the comparison that is the entire point of the job.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/server.js
          test -f dist/config.js
          test -d dist/tools

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  quick-smoke-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run quick smoke test
        run: npm run test:quick
        env:
          DECIBEL_ENV: test
          DECIBEL_MCP_ROOT: /tmp/decibel-test-data
