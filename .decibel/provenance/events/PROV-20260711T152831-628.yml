summary: "Logged friction: Onboarding a new pro user is clunky and manual. Installing @decibelsystems/tools creates no config — no postinstall hook, and loadConfig() returns defaults without writing a file. The user must hand-create ~/.decibel/config.yaml and paste the license key. On top of that, provisioning the key itself is manual (insert a row into the Core Supabase licenses table), and the license validation ref was stale/hardcoded. We need a one-click / single-command setup (e.g. `decibel setup <key>` or an interactive init) that provisions the key and writes the config in one step."
