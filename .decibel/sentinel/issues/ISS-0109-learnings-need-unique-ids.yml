uid: 01a04ec3-f0de-768d-bc4c-c5a89acccf9e
id: ISS-0109
title: Learnings entries need unique IDs
status: open
priority: low
tags:
  - learnings
  - enhancement
description: |
  Learnings entries are currently appended to a markdown file without unique IDs.
  Should have IDs like LRN-0001 for referencing and deduplication.

  Current format in learnings.md lacks identifiers for individual entries.
created: 2025-12-25
renumbered_from: ISS-0017
renumbered_at: 2026-05-20T00:55:20.000Z
proposed_fix:
  triage_date: 2026-05-19
  detail: |-
    In src/tools/learnings.ts, generate LRN-NNNN IDs on append (mirror the
    ISS-NNNN counter pattern in sentinel.ts). Per-entry markdown sections
    start with '### LRN-NNNN: <title>' so they are greppable. Update
    learnings_list to surface the ID.
  effort: ~2 hours
  risk: low — backwards-compatible; old entries without IDs keep working
  pr_shape: single file change (src/tools/learnings.ts) + 2-3 unit tests
  priority: "#5 in recommended sequence (quick win)"
