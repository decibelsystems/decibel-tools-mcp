objectives:
  - id: OBJ-0001
    title: v2 Architecture Foundation
    timeframe: 2026-H1
    owner: core
    key_results:
      - metric: facades replacing raw tools
        target: 33 facades over 250+ tools
        current: shipped
      - metric: unified kernel dispatch path
        target: 1 path serving stdio + HTTP
        current: shipped
  - id: OBJ-0002
    title: Universal Client Reach
    timeframe: 2026-H2
    owner: core
    key_results:
      - metric: AI clients supported
        target: ">=5 (Cursor, Replit, ChatGPT, v0, Lovable)"
        current: "3"
      - metric: VS Code extension on marketplace
        target: live + post-launch polish complete
        current: v0.4.1 live
  - id: OBJ-0003
    title: Remote Agent Operations
    timeframe: 2026-H2
    owner: core
    key_results:
      - metric: agent write queue
        target: enqueue / dispatch / sync in production
        current: MVP dispatch shipped
      - metric: cloud-backed persistence
        target: Supabase-backed roadmap + sentinel stores
        current: in progress
  - id: OBJ-0004
    title: Domain Tooling & Demos
    timeframe: 2026 ongoing
    owner: core
    key_results:
      - metric: domain facades shipped
        target: figma + deck intel
        current: deck shipped (10 tools)
themes:
  - id: platform
    label: Platform & Architecture
    description: Core engine — kernel, facades, transports, daemon, hooks
  - id: distribution
    label: Distribution & Reach
    description: Decibel usable from every major AI client and device
  - id: agents
    label: Agents & Cloud
    description: Remote multi-agent operations and cloud-backed persistence
  - id: tooling
    label: Domain Tooling
    description: Vertical tool suites and live demos
