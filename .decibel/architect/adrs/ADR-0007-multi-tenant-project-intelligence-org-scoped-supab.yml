id: ADR-0007
scope: project
project: decibel-tools-mcp
title: "Multi-tenant project-intelligence: org-scoped Supabase store via daemon Store abstraction + user-JWT write identity"
status: accepted
created_at: 2026-05-24T12:15:59.126Z
updated_at: 2026-05-24T12:15:59.126Z
context: "Decibel's general project-intelligence facades (oracle, sentinel, architect, friction) read/write box-local .decibel/ YAML files via resolveProjectPaths + fs. The hosted MCP (senken.pro = this repo as a submodule on Render) is therefore single-tenant and box-local: it serves only /opt/render/.../decibel-mcp/.decibel, and project_id is effectively ignored because resolveProject() falls through to Strategy 6 (DECIBEL_PROJECT_ROOT fallback) / Strategy 7 (cwd fallback) and collapses every request to the box's one project. There is no shared/Supabase project-data store (the only Supabase code — lib/supabase.ts, deck.ts, swarm.ts — is the deck game + swarm coordination, not project intelligence). This blocks HQ's hosted web from showing per-org/per-user portfolio data. Ben's decision: build HQ as a real multi-tenant SaaS (chose option D over single-tenant or box-local-multi-project)."
decision: "Build a shared, tenant-scoped project-intelligence store with a clean read/write split. LOCKED by Ben: (1) Tenancy unit = ORG/workspace — hq.accounts stays user identity (1:1 auth.users); new hq.orgs + hq.org_members (user↔org+role) + hq.projects (project→org); project-intel tables tagged org_id+project_id; RLS scoped by membership (auth.uid() ∈ org_members); plan_tier/billing moves to org. (2) Web reads Supabase DIRECTLY under RLS with the user's JWT (real-time via supabase-js) — no daemon in the web read path; this dissolves the daemon-on-web problem and never touches senken.pro for reads. Daemon-side architecture (this repo): (a) abstract the data layer behind a Store interface with two impls — FsStore (local/dev, git-tracked .decibel, offline) and SupabaseStore (hosted/tenant, direct writes, cloud = source of truth), selected by config/deployment; NO continuous bidirectional local↔cloud sync on the hot path. (b) Write-identity: daemon writes carry the CALLER's user JWT (via the existing X-User-Key header → DispatchContext.userKey) through to Supabase so RLS holds end-to-end — NOT a blanket service-role. (c) Tenant-aware resolver: project_id maps to org-scoped store rows for hosted, replacing the Strategy 6/7 box-fs fallback. (d) One-time idempotent .decibel→store migration importer owned in this repo, keyed by stable IDs, parsing the canonical .md frontmatter format. Ownership: this repo owns the daemon data layer + migration; HQ owns the Supabase schema/RLS + web consumer; shared contract = table shapes + the write-identity header model."
consequences: "POSITIVE: enables HQ as multi-tenant SaaS; web needs no daemon for reads (RLS + JWT do tenant isolation), eliminating the unauth senken.pro passthrough exposure for the web; FsStore preserves the local git-tracked/offline workflow for dev/solo. RISK/SEQUENCING: the read_issue/update_issue store-split bug (issue 2026-05-23T23-45-31Z) must be fixed before the importer so it reads cleanly; write-identity JWT passthrough is the linchpin — if daemon writes use service-role instead of the caller JWT, RLS silently doesn't apply and tenant isolation breaks. Cross-repo + multi-phase: requires lockstep on table shapes + the write-identity header contract before implementation. Migration is one-time; .decibel/ stays as local cache during transition. FOLLOW-UP: exact table shapes + write-identity header contract + stable-ID keying to be co-designed with HQ once the schema draft lands."
related_issues: '["2026-05-23T23-45-31Z-sentinel-read-issue-update-issue-ignore-project-id.md"]'
