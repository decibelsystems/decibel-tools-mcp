id: ADR-0006
scope: project
project: decibel-tools-mcp
title: Daemon binds canonical 127.0.0.1:4888; CLI arg parsing must not bake defaults that short-circuit daemonConfig
status: accepted
created_at: 2026-05-23T23:48:23.529Z
updated_at: 2026-05-23T23:48:23.529Z
context: |-
  The MCP daemon (`node dist/server.js --daemon`) was binding `*:8787` (all interfaces, no-auth /health reachable beyond localhost) even though `daemonConfig.ts` DEFAULT_CONFIG specifies `port: 4888, host: '127.0.0.1'` and `config.yaml` was absent. Every Claude SessionStart and discovery-less client (deck-web, VS Code extension, scripts hardcoding 4888) reported "Daemon not reachable"; only HQ's vite.config worked because it reads `~/.decibel/daemon.meta`.

  Root cause (traced through the live code path): `parseHttpArgs()` (httpServer.ts) runs for EVERY mode and returned baked-in truthy defaults — `port=8787` when no `--port`/`PORT`, `host='0.0.0.0'` when no `--host`. Those truthy values won the `||` chains in server.ts (`port || daemonConfig.daemon.port || 4888` and `host || (daemonMode ? daemonConfig.daemon.host : ...)`), making daemonConfig's 4888/127.0.0.1 DEAD CODE in daemon mode. This single bug also (a) kept the 2026-04-01 "binding 0.0.0.0 broke senken.pro routing" issue alive (host never fell through to 127.0.0.1) and (b) mis-pointed bridge mode (server.ts daemonUrl resolved to 8787, not 4888). It was NOT stale dist — dist was fresh and contained the correct daemonConfig values; they simply never executed.
decision: "4888 / 127.0.0.1 is canonical for the local daemon (it was always the source/config default; the fix makes it actually take effect). `parseHttpArgs` now returns `undefined` for port/host when `--port`/`--host` are absent — still honoring `process.env.PORT` (Render) — so server.ts resolution falls through to daemonConfig defaults instead of being short-circuited. `transports/http.ts` fallback changed `8787`→`4888`; `start.sh` default `8787`→`4888`. Explicit `--port`/`--host` flags and `PORT` env still override. Also standardized the SessionStart hook doc on the facade action `list_issues` (camelCase `listIssues` silently errored). The live daemon was restarted and verified: `lsof` shows `127.0.0.1:4888 LISTEN`, daemon.meta `{port:4888,pid:65603}`, /health ok (33 facades, pro)."
consequences: "POSITIVE: daemon is localhost-only on the canonical port — fixes reachability for all hardcoded-4888 clients AND removes the all-interfaces no-auth exposure AND fixes bridge mode, all at once. Render/external `--http` deploys unaffected (PORT env still honored; transport host default stays 0.0.0.0 for those). A single canonical default that actually applies prevents future port drift. NEUTRAL/FOLLOW-UP: clients should still prefer `daemon.meta` discovery as defense-in-depth (VS Code extension mcpClient.ts + package.json, scripts/boot-local.sh) — tracked on the open port issue. senken.pro routing should be re-verified now that host is 127.0.0.1 (the 2026-04-01 issue's intent). Changes are on branch test/scan-and-discovery, not yet committed."
related_issues: '["2026-05-23T23-32-49Z-daemon-clients-hardcode-port-4888-but-daemon-runs-.md", "2026-04-01T06-32-12Z-mcp-daemon-was-binding-0-0-0-0-broke-senken-pro-ro.md"]'
